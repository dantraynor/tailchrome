<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1400, initial-scale=1">
    <title>Tailchrome marquee</title>
    <link rel="stylesheet" href="campaign.css">
  </head>
  <body class="marquee marquee-canvas">
    <img class="photo" src="artwork/network-paper.png" alt="">
    <header class="topline">
      <div class="brand">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
        Tailchrome
      </div>
      <div class="series">Chrome + Firefox</div>
    </header>
    <main class="copy">
      <div class="eyebrow">Private network / browser-sized</div>
      <h1>Your tailnet,<br>in this browser.</h1>
      <p class="lede">A full Tailscale node for every browser profile, without changing system networking.</p>
    </main>
    <div class="product-frame" data-profile="Work profile">
      <div class="capture">
        <img src="artwork/ui/dashboard.png" alt="">
      </div>
    </div>
  </body>
</html>
