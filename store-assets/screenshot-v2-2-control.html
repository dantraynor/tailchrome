<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1280, initial-scale=1">
    <title>Tailchrome — tailnet controls</title>
    <link rel="stylesheet" href="campaign.css">
  </head>
  <body class="control store-canvas">
    <header class="topline">
      <div class="brand">
        <span class="mark mark--light" aria-hidden="true"><i></i><i></i><i></i></span>
        Tailchrome
      </div>
      <div class="series">02 / Control surface</div>
    </header>
    <main class="copy">
      <div class="eyebrow">The useful controls, close at hand</div>
      <h1>Your whole tailnet. One click away.</h1>
      <p class="lede">See your node, choose a route, and reach devices without leaving the page.</p>
      <div class="tags">
        <span class="tag">MagicDNS</span>
        <span class="tag">Peers</span>
        <span class="tag">Side panel</span>
      </div>
    </main>
    <svg class="route-overlay" viewBox="0 0 780 190" aria-hidden="true">
      <path class="shadow" d="M0 145 C150 145 180 35 345 35 S570 150 780 65"></path>
      <path d="M0 145 C150 145 180 35 345 35 S570 150 780 65"></path>
    </svg>
    <div class="product-frame" data-profile="Browser node">

        <img src="artwork/ui/dashboard.png" alt="">
      </div>
    </div>
