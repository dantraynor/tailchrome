<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1400, initial-scale=1">
    <title>Tailchrome product overview</title>
    <link rel="stylesheet" href="campaign.css">
  </head>
  <body class="readme-overview readme-canvas">
    <header class="topline">
      <div class="brand">
        <span class="mark mark--light" aria-hidden="true"><i></i><i></i><i></i></span>
        Tailchrome
      </div>
      <div class="series">Built for the browser</div>
    </header>
    <section class="intro">
      <div class="eyebrow">One small control surface</div>
      <h1>See it.<br>Route it.<br>Keep it separate.</h1>
      <p class="lede">Live tailnet status, flexible exit routing, and profile-level identities.</p>
    </section>
    <div class="product-frame frame-a" data-profile="Status">
      <div class="capture"><img src="artwork/ui/dashboard.png" alt=""></div>
    </div>
    <div class="product-frame frame-b" data-profile="Exit">
      <div class="capture"><img src="artwork/ui/exit-nodes.png" alt=""></div>
    </div>
    <div class="product-frame frame-c" data-profile="Rules">
      <div class="capture"><img src="artwork/ui/split-tunneling.png" alt=""></div>
    </div>
    <span class="mini-label label-a">Live status</span>
    <span class="mini-label label-b">Exit nodes</span>
    <span class="mini-label label-c">Split tunneling</span>
  </body>
</html>
