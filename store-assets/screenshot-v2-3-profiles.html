<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1280, initial-scale=1">
    <title>Tailchrome — isolated browser profiles</title>
    <link rel="stylesheet" href="campaign.css">
  </head>
  <body class="profiles store-canvas">
    <header class="topline">
      <div class="brand">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
        Tailchrome
      </div>
      <div class="series" style="color: var(--paper)">03 / Profile isolation</div>
    </header>
    <main class="copy">
      <div class="eyebrow">Separate by design</div>
      <h1>A tailnet for<br>every profile.</h1>
      <p class="lede">Keep work and personal network identities independent in the same browser.</p>
    </main>
    <div class="lane lane-a" aria-hidden="true"><span class="lane-label">Work / 100.64.0.1</span></div>
    <div class="lane lane-b" aria-hidden="true"><span class="lane-label">Personal / 100.88.0.1</span></div>
    <div class="product-frame profile-frame" data-profile="Profiles">
      <div class="capture">
        <img src="artwork/ui/profiles.png" alt="">
      </div>
    </div>
    <div class="product-frame dark-frame" data-profile="Personal profile">
      <div class="capture">
        <img src="artwork/ui/dashboard-dark.png" alt="">
      </div>
    </div>
  </body>
</html>
