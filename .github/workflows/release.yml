name: Release Candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build, for example v0.1.5
        required: true
        type: string

permissions:
  contents: read

# Required repository secrets:
#   APPLE_CERTIFICATE_P12        - base64-encoded Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD   - password for the .p12
#   APPLE_API_KEY_ID             - App Store Connect API key ID
#   APPLE_API_ISSUER_ID          - App Store Connect API issuer UUID
#   APPLE_API_KEY_P8             - contents of the AuthKey_*.p8 file
#
# Windows candidate creation remains intentionally blocked until one signing
# provider and exact WINDOWS_EXPECTED_SIGNER_SUBJECT repository variable are
# recorded. No unsigned or provider-switching fallback is present.
#
# Defender evidence runs only on a controlled, single-use x64 Windows runner
# carrying a run-specific tailchrome-defender-${run_id} label. Its runner
# account must be elevated, Defender must support active mode, Microsoft
# security intelligence and cloud-protection endpoints must be reachable, and
# the machine must be created from the approved clean image for this one tagged
# release job, then destroyed. Never bring the runner online until the protected
# windows-defender-validation deployment has been reviewed.

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - name: Resolve immutable source
        id: source
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Dispatch this workflow from the same tag supplied as release_tag." >&2
            exit 1
          fi
          source_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$source_sha" = "$tag_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/setup-go@v6
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - run: pnpm install --frozen-lockfile
      - run: go mod download
        working-directory: host
      - run: pnpm validate:ids
      - run: pnpm validate:release-tag "$RELEASE_TAG"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:installer
      - run: go test -race ./...
        working-directory: host
      - run: go vet ./...
        working-directory: host
      - run: pnpm zip:chrome
      - run: pnpm zip:firefox
      - run: make host-all
      - name: Verify Firefox source ZIP rebuild
        run: |
          set -euo pipefail
          original_dir="$RUNNER_TEMP/firefox-original"
          source_dir="$RUNNER_TEMP/firefox-source"
          rebuilt_dir="$RUNNER_TEMP/firefox-rebuilt"
          mkdir -p "$original_dir" "$source_dir" "$rebuilt_dir"
          unzip -q packages/extension/.output/firefox.zip -d "$original_dir"
          unzip -q packages/extension/.output/firefox-sources.zip -d "$source_dir"
          pushd "$source_dir" >/dev/null
          pnpm install --frozen-lockfile
          pnpm --filter @tailchrome/extension zip:firefox
          unzip -q packages/extension/.output/firefox.zip -d "$rebuilt_dir"
          diff -qr "$original_dir" "$rebuilt_dir"
          popd >/dev/null
      - name: Upload reviewed build outputs
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          retention-days: 7
          path: |
            dist/tailscale-browser-ext-darwin-amd64
            dist/tailscale-browser-ext-darwin-arm64
            dist/tailscale-browser-ext-linux-amd64
            dist/tailscale-browser-ext-linux-arm64
            dist/tailscale-browser-ext-windows-amd64.exe
            packages/extension/.output/chrome.zip
            packages/extension/.output/firefox.zip
            packages/extension/.output/firefox-sources.zip

  sign-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download reviewed build outputs
        uses: actions/download-artifact@v6
        with:
          name: build-output
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/certificate.p12"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 20)"
          cert_pass="${APPLE_CERTIFICATE_PASSWORD%$'\r'}"
          cert_pass="${cert_pass%$'\n'}"

          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -P "$cert_pass" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
      - name: Sign Darwin binaries
        env:
          MACOS_APPLICATION_IDENTITY: "Developer ID Application: Daniel David Traynor (UL9B796XFN)"
        run: |
          set -euo pipefail
          for bin in dist/tailscale-browser-ext-darwin-amd64 dist/tailscale-browser-ext-darwin-arm64; do
            chmod +x "$bin"
            codesign --force --timestamp --options runtime --sign "$MACOS_APPLICATION_IDENTITY" "$bin"
          done
      - name: Notarize and verify Darwin binaries
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          for bin in dist/tailscale-browser-ext-darwin-amd64 dist/tailscale-browser-ext-darwin-arm64; do
            ditto -c -k --keepParent "$bin" "${bin}.zip"
            xcrun notarytool submit "${bin}.zip" \
              --key "$key_path" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait
            codesign --verify --deep --strict --verbose=2 "$bin"
            # spctl --assess rejects bare Mach-O executables ("does not seem
            # to be an app"); standalone binaries are checked per Apple's
            # "Testing a Notarised Product" guidance instead.
            codesign --verify --verbose=2 -R="notarized" --check-notarization "$bin"
          done
      - name: Upload final Darwin binaries
        uses: actions/upload-artifact@v6
        with:
          name: signed-darwin
          retention-days: 7
          path: |
            dist/tailscale-browser-ext-darwin-amd64
            dist/tailscale-browser-ext-darwin-arm64

  package-macos:
    needs: build
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/certificate.p12"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 20)"
          cert_pass="${APPLE_CERTIFICATE_PASSWORD%$'\r'}"
          cert_pass="${cert_pass%$'\n'}"

          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -P "$cert_pass" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
      - name: Build signed macOS package
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          MACOS_SIGN_APPLICATION_IDENTITY: "Developer ID Application: Daniel David Traynor (UL9B796XFN)"
          MACOS_SIGN_INSTALLER_IDENTITY: "Developer ID Installer: Daniel David Traynor (UL9B796XFN)"
        run: ./packaging/macos/build-pkg.sh
      - name: Notarize and staple macOS package
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          xcrun notarytool submit dist/tailchrome-helper-macos.pkg \
            --key "$key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/tailchrome-helper-macos.pkg
      - name: Verify final package and embedded repair app
        run: |
          set -euo pipefail
          pkg="dist/tailchrome-helper-macos.pkg"
          expanded="$RUNNER_TEMP/tailchrome-pkg"
          pkgutil --check-signature "$pkg"
          xcrun stapler validate "$pkg"
          pkgutil --expand-full "$pkg" "$expanded"
          app="$expanded/Payload/Applications/Tailchrome Helper.app"
          test -x "$app/Contents/MacOS/tailchrome-helper"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Upload final macOS package
        uses: actions/upload-artifact@v6
        with:
          name: signed-macos-package
          retention-days: 7
          path: dist/tailchrome-helper-macos.pkg

  package-linux:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: Download reviewed build outputs
        uses: actions/download-artifact@v6
        with:
          name: build-output
      - name: Install packaging inspection tools
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          sudo apt-get update
          sudo apt-get install --yes rpm
      - name: Build and inspect Linux packages
        run: |
          set -euo pipefail
          file dist/tailscale-browser-ext-linux-amd64 | grep -Eq 'x86-64|x86_64'
          file dist/tailscale-browser-ext-linux-arm64 | grep -Eq 'ARM aarch64|ARM64'
          go version -m dist/tailscale-browser-ext-linux-amd64
          go version -m dist/tailscale-browser-ext-linux-arm64
          VERSION="$RELEASE_TAG" ./packaging/linux/build-packages.sh
          dpkg-deb --info dist/tailchrome-helper-linux-amd64.deb
          deb_control="$RUNNER_TEMP/tailchrome-deb-control"
          dpkg-deb --control dist/tailchrome-helper-linux-amd64.deb "$deb_control"
          for script in preinst postinst prerm postrm config triggers; do
            test ! -e "$deb_control/$script"
          done
          dpkg-deb --contents dist/tailchrome-helper-linux-amd64.deb |
            tee /tmp/tailchrome-deb-contents.txt
          rpm -qip dist/tailchrome-helper-linux-x86_64.rpm
          test -z "$(rpm -qp --scripts dist/tailchrome-helper-linux-x86_64.rpm)"
          rpm -qlp dist/tailchrome-helper-linux-x86_64.rpm |
            tee /tmp/tailchrome-rpm-contents.txt
          if grep -E '(^|/)(home|Users)/' \
            /tmp/tailchrome-deb-contents.txt \
            /tmp/tailchrome-rpm-contents.txt; then
            echo "Linux packages contain an unexpected user-home path." >&2
            exit 1
          fi
      - name: Upload final Linux packages
        uses: actions/upload-artifact@v6
        with:
          name: linux-packages
          retention-days: 7
          path: |
            dist/tailchrome-helper-linux-amd64.deb
            dist/tailchrome-helper-linux-x86_64.rpm

  validate-windows-defender-environment:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      DEFENDER_ENVIRONMENT: windows-defender-validation
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require protected Defender runner controls
        env:
          BROAD_SCOPE_DEFENDER_IMAGE_ID: ${{ vars.WINDOWS_DEFENDER_IMAGE_ID }}
        run: |
          set -euo pipefail
          test -z "$BROAD_SCOPE_DEFENDER_IMAGE_ID"
          environment_json="$(
            gh api "repos/$GITHUB_REPOSITORY/environments/$DEFENDER_ENVIRONMENT"
          )"
          reviewer_count="$(
            jq '[.protection_rules[]? |
              select(.type == "required_reviewers") |
              .reviewers[]?] | length' <<<"$environment_json"
          )"
          test "$reviewer_count" -ge 1
          jq -e '.can_admins_bypass == false' <<<"$environment_json" >/dev/null
          jq -e '
            .deployment_branch_policy.protected_branches == false and
            .deployment_branch_policy.custom_branch_policies == true
          ' <<<"$environment_json" >/dev/null

          policies_json="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/environments/$DEFENDER_ENVIRONMENT/deployment-branch-policies"
          )"
          jq -e '
            .total_count == 1 and
            .branch_policies[0].type == "tag" and
            .branch_policies[0].name == "v*"
          ' <<<"$policies_json" >/dev/null

  package-windows:
    needs: build
    runs-on: windows-2025
    outputs:
      artifact_id: ${{ steps.upload-windows.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-windows.outputs.artifact-digest }}
      raw_sha256: ${{ steps.windows-hashes.outputs.raw_sha256 }}
      msi_sha256: ${{ steps.windows-hashes.outputs.msi_sha256 }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      WINDOWS_SIGNTOOL_PATH: C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe
      WINDOWS_EXPECTED_SIGNER_SUBJECT: ${{ vars.WINDOWS_EXPECTED_SIGNER_SUBJECT }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Require Windows release signing configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_EXPECTED_SIGNER_SUBJECT)) {
            throw "WINDOWS_EXPECTED_SIGNER_SUBJECT must contain the exact selected publisher subject."
          }
          if (-not (Test-Path -LiteralPath $env:WINDOWS_SIGNTOOL_PATH -PathType Leaf)) {
            throw "Expected SignTool was not found at $env:WINDOWS_SIGNTOOL_PATH"
          }
      - name: Download reviewed build outputs
        uses: actions/download-artifact@v6
        with:
          name: build-output
      - name: Install WiX
        run: dotnet tool install --global wix --version 6.0.2
      # Provider integration gate: the selected provider must place the
      # timestamped raw EXE in signed-windows before MSI construction, then
      # sign the unsigned MSI to the final filename before verification.
      - name: Build Windows MSI from the signed helper
        shell: pwsh
        run: |
          $signedExe = ".\signed-windows\tailscale-browser-ext-windows-amd64.exe"
          if (-not (Test-Path -LiteralPath $signedExe -PathType Leaf)) {
            throw "The selected signing provider must produce the timestamped raw EXE before MSI construction."
          }
          .\packaging\windows\build-msi.ps1 `
            -Version "$env:RELEASE_TAG" `
            -HelperExe $signedExe `
            -OutPath .\signed-windows\tailchrome-helper-windows-x64.unsigned.msi `
            -ExpectedSignerSubject "$env:WINDOWS_EXPECTED_SIGNER_SUBJECT" `
            -SignToolPath "$env:WINDOWS_SIGNTOOL_PATH"
      - name: Verify raw, embedded, and outer Windows signatures
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:WINDOWS_SIGNTOOL_PATH -PathType Leaf)) {
            throw "Expected SignTool was not found at $env:WINDOWS_SIGNTOOL_PATH"
          }
          .\scripts\verify-windows-signatures.ps1 `
            -RawExe .\signed-windows\tailscale-browser-ext-windows-amd64.exe `
            -Msi .\signed-windows\tailchrome-helper-windows-x64.msi `
            -ExpectedSignerSubject "$env:WINDOWS_EXPECTED_SIGNER_SUBJECT" `
            -SignToolPath "$env:WINDOWS_SIGNTOOL_PATH" `
            -SummaryPath .\signed-windows\windows-signature-verification.json
      - name: Record final Windows hashes
        id: windows-hashes
        shell: pwsh
        run: |
          $rawHash = (
            Get-FileHash `
              -LiteralPath .\signed-windows\tailscale-browser-ext-windows-amd64.exe `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $msiHash = (
            Get-FileHash `
              -LiteralPath .\signed-windows\tailchrome-helper-windows-x64.msi `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          "raw_sha256=$rawHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "msi_sha256=$msiHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Upload final Windows bundle
        id: upload-windows
        uses: actions/upload-artifact@v6
        with:
          name: signed-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            signed-windows/tailscale-browser-ext-windows-amd64.exe
            signed-windows/tailchrome-helper-windows-x64.msi
            signed-windows/windows-signature-verification.json

  scan-windows-defender:
    needs: [build, package-windows, validate-windows-defender-environment]
    runs-on:
      [self-hosted, Windows, X64, "tailchrome-defender-${{ github.run_id }}"]
    environment: windows-defender-validation
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      PACKAGE_ARTIFACT_DIGEST: ${{ needs.package-windows.outputs.artifact_digest }}
      PACKAGE_ARTIFACT_ID: ${{ needs.package-windows.outputs.artifact_id }}
      EXPECTED_MSI_SHA256: ${{ needs.package-windows.outputs.msi_sha256 }}
      EXPECTED_RAW_SHA256: ${{ needs.package-windows.outputs.raw_sha256 }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
    steps:
      - name: Validate controlled-runner assignment
        id: assignment
        shell: pwsh
        env:
          APPROVED_CONTROLLED_IMAGE_ID: ${{ vars.WINDOWS_DEFENDER_IMAGE_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_ENVIRONMENT -cne "self-hosted" -or
              $env:RUNNER_OS -cne "Windows" -or
              $env:RUNNER_ARCH -cne "X64") {
            throw "Defender evidence requires the controlled self-hosted Windows x64 runner."
          }
          if ($env:GITHUB_REPOSITORY -cne "dantraynor/tailchrome" -or
              $env:GITHUB_WORKFLOW -cne "Release Candidate" -or
              $env:GITHUB_WORKFLOW_REF -cne
                "dantraynor/tailchrome/.github/workflows/release.yml@$($env:GITHUB_REF)" -or
              $env:GITHUB_JOB -cne "scan-windows-defender" -or
              $env:GITHUB_REF_TYPE -cne "tag" -or
              $env:GITHUB_REF_NAME -cne $env:RELEASE_TAG -or
              $env:GITHUB_SHA -cne $env:SOURCE_SHA) {
            throw "The controlled runner was assigned to an unexpected release job or source."
          }
          $controlledImageId = $env:APPROVED_CONTROLLED_IMAGE_ID
          if ([string]::IsNullOrWhiteSpace($controlledImageId)) {
            throw "WINDOWS_DEFENDER_IMAGE_ID must identify the approved clean runner image."
          }
          $observedControlledImageId = [Environment]::GetEnvironmentVariable(
            "TAILCHROME_DEFENDER_IMAGE_ID",
            [EnvironmentVariableTarget]::Machine
          )
          if ([string]::IsNullOrWhiteSpace($observedControlledImageId) -or
              $observedControlledImageId -cne $controlledImageId) {
            throw "The runner's host-owned image ID does not match the approved clean image."
          }
          "CONTROLLED_IMAGE_ID=$controlledImageId" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          "OBSERVED_CONTROLLED_IMAGE_ID=$observedControlledImageId" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          if ($env:PACKAGE_ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or
              $env:PACKAGE_ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$' -or
              $env:EXPECTED_RAW_SHA256 -notmatch '^[0-9a-f]{64}$' -or
              $env:EXPECTED_MSI_SHA256 -notmatch '^[0-9a-f]{64}$') {
            throw "The signed Windows artifact provenance is incomplete."
          }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.source_sha }}
      - name: Prepare controlled-runner workspace
        id: prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $trackedChanges = @(& git status --porcelain --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or $trackedChanges.Count -ne 0) {
            throw "The controlled runner checkout is not clean."
          }
          if (Test-Path -LiteralPath .\signed-windows) {
            Remove-Item -LiteralPath .\signed-windows -Recurse -Force
          }
          New-Item -ItemType Directory -Path .\signed-windows | Out-Null
      - name: Download final Windows bundle
        id: download-windows
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.package-windows.outputs.artifact_id }}
          path: signed-windows
      - name: Initialize Defender and scan final Windows files
        id: defender-scan
        if: ${{ always() && steps.assignment.outcome == 'success' && steps.prepare.outcome == 'success' }}
        shell: pwsh
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download-windows.outcome }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:RUNNER_ENVIRONMENT -cne "self-hosted" -or
              $env:RUNNER_OS -cne "Windows" -or
              $env:RUNNER_ARCH -cne "X64") {
            throw "Defender evidence requires the controlled self-hosted Windows x64 runner."
          }
          $operatingSystemVersion = [Environment]::OSVersion.VersionString
          if ([string]::IsNullOrWhiteSpace($operatingSystemVersion)) {
            throw "The controlled runner operating-system version could not be recorded."
          }
          $defenderPolicyOutput = @(
            & git rev-parse "HEAD:scripts/initialize-windows-defender.ps1"
          )
          $defenderPolicyExitCode = $LASTEXITCODE
          $releaseWorkflowOutput = @(
            & git rev-parse "HEAD:.github/workflows/release.yml"
          )
          $releaseWorkflowExitCode = $LASTEXITCODE
          if ($defenderPolicyExitCode -ne 0 -or
              $releaseWorkflowExitCode -ne 0 -or
              $defenderPolicyOutput.Count -ne 1 -or
              $releaseWorkflowOutput.Count -ne 1) {
            throw "The Defender policy provenance could not be recorded."
          }
          $defenderPolicyBlobId = ([string]$defenderPolicyOutput[0]).Trim()
          $releaseWorkflowBlobId = ([string]$releaseWorkflowOutput[0]).Trim()
          if (
              $defenderPolicyBlobId -notmatch '^[0-9a-f]{40,64}$' -or
              $releaseWorkflowBlobId -notmatch '^[0-9a-f]{40,64}$') {
            throw "The Defender policy provenance could not be recorded."
          }
          $bundleRoot = (Resolve-Path .\signed-windows).Path
          $evidencePath = Join-Path $bundleRoot "windows-defender-verification.json"
          $signatureSummaryPath = Join-Path `
            $bundleRoot `
            "windows-signature-verification.json"
          $expectedFiles = @(
            [ordered]@{
              name = "tailscale-browser-ext-windows-amd64.exe"
              path = Join-Path $bundleRoot "tailscale-browser-ext-windows-amd64.exe"
              sha256 = $env:EXPECTED_RAW_SHA256
            },
            [ordered]@{
              name = "tailchrome-helper-windows-x64.msi"
              path = Join-Path $bundleRoot "tailchrome-helper-windows-x64.msi"
              sha256 = $env:EXPECTED_MSI_SHA256
            }
          )
          $targetPaths = @($expectedFiles | ForEach-Object { $_.path })
          $scanAttemptStartedAt = [DateTime]::UtcNow
          $candidateScanStartedAt = $null
          $script:lastNativeScanExitCode = $null

          try {
            if ($env:DOWNLOAD_OUTCOME -cne "success") {
              throw "The signed Windows artifact download did not complete successfully."
            }
            $expectedAllowlist = @(
              "tailchrome-helper-windows-x64.msi"
              "tailscale-browser-ext-windows-amd64.exe"
              "windows-signature-verification.json"
            )
            $actualAllowlist = @(
              Get-ChildItem -LiteralPath $bundleRoot -File |
                ForEach-Object { $_.Name } |
                Sort-Object
            )
            if ($actualAllowlist.Count -ne $expectedAllowlist.Count -or
                @(
                  Compare-Object `
                    -ReferenceObject $expectedAllowlist `
                    -DifferenceObject $actualAllowlist
                ).Count -ne 0) {
              throw "The signed Windows artifact does not match the exact file allowlist."
            }
            $signatureSummary = (
              Get-Content -LiteralPath $signatureSummaryPath -Raw -ErrorAction Stop |
                ConvertFrom-Json -ErrorAction Stop
            )
            if ([string]$signatureSummary.rawExe.sha256 -cne $env:EXPECTED_RAW_SHA256 -or
                [string]$signatureSummary.msi.sha256 -cne $env:EXPECTED_MSI_SHA256) {
              throw "The signed Windows artifact hashes do not match their package outputs."
            }
            foreach ($file in $expectedFiles) {
              if (-not (Test-Path -LiteralPath $file.path -PathType Leaf)) {
                throw "A final Windows candidate is missing before Defender initialization."
              }
              $actualHash = (
                Get-FileHash -LiteralPath $file.path -Algorithm SHA256
              ).Hash.ToLowerInvariant()
              if ($actualHash -cne $file.sha256) {
                throw "A final Windows candidate changed during artifact transfer."
              }
            }
            $readinessPath = Join-Path $env:RUNNER_TEMP "windows-defender-readiness.json"
            .\scripts\initialize-windows-defender.ps1 `
              -RunDetectionSmokeTest `
              -SummaryPath $readinessPath
            $readiness = Get-Content -LiteralPath $readinessPath -Raw | ConvertFrom-Json

            function Get-ValidatedDefenderState {
              $serviceState = Get-Service -Name WinDefend -ErrorAction Stop
              $computerStatus = Get-MpComputerStatus -ErrorAction Stop
              $defenderPreference = Get-MpPreference -ErrorAction Stop
              $pathExclusionState = @(
                $defenderPreference.ExclusionPath |
                  Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }
              )
              $extensionExclusionState = @(
                $defenderPreference.ExclusionExtension |
                  Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }
              )
              $processExclusionState = @(
                $defenderPreference.ExclusionProcess |
                  Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }
              )
              if (-not $computerStatus.AntivirusEnabled -or
                  -not $computerStatus.AMServiceEnabled -or
                  -not $computerStatus.RealTimeProtectionEnabled -or
                  -not $computerStatus.BehaviorMonitorEnabled -or
                  -not $computerStatus.IoavProtectionEnabled -or
                  -not $computerStatus.OnAccessProtectionEnabled -or
                  $serviceState.Status -ne "Running" -or
                  $computerStatus.AMRunningMode -cne "Normal" -or
                  $null -eq $computerStatus.AntivirusSignatureLastUpdated -or
                  $computerStatus.AntivirusSignatureAge -gt 1) {
                throw "Active, current Defender protection could not be proven on this runner."
              }
              if ([int]$defenderPreference.MAPSReporting -ne 2 -or
                  [int]$defenderPreference.SubmitSamplesConsent -ne 1 -or
                  [int]$defenderPreference.PUAProtection -ne 1 -or
                  [bool]$defenderPreference.DisableBlockAtFirstSeen -or
                  [bool]$defenderPreference.DisableRealtimeMonitoring -or
                  [bool]$defenderPreference.DisableBehaviorMonitoring -or
                  [bool]$defenderPreference.DisableIntrusionPreventionSystem -or
                  [bool]$defenderPreference.DisableIOAVProtection -or
                  [bool]$defenderPreference.DisableScriptScanning -or
                  [bool]$defenderPreference.DisableArchiveScanning -or
                  -not [bool]$defenderPreference.DisableAutoExclusions -or
                  -not [bool]$defenderPreference.CheckForSignaturesBeforeRunningScan -or
                  [bool]$defenderPreference.SignatureDisableUpdateOnStartupWithoutEngine -or
                  $pathExclusionState.Count -ne 0 -or
                  $extensionExclusionState.Count -ne 0 -or
                  $processExclusionState.Count -ne 0) {
                throw "Required Defender preferences and exclusion-free scanning could not be proven."
              }
              [pscustomobject][ordered]@{
                Service = $serviceState
                Status = $computerStatus
                Preference = $defenderPreference
                PathExclusions = $pathExclusionState
                ExtensionExclusions = $extensionExclusionState
                ProcessExclusions = $processExclusionState
              }
            }
            $null = Get-ValidatedDefenderState
            if (-not [bool]$readiness.mapsConnectionValidated -or
                [int]$readiness.mapsValidationExitCode -ne 0 -or
                -not [bool]$readiness.detectionSmokeTestPassed) {
              throw "Defender cloud connectivity and detection could not be proven on this runner."
            }

            $platformRoot = Join-Path $env:ProgramData "Microsoft\Windows Defender\Platform"
            $mpCmdRunCandidates = @()
            if (Test-Path -LiteralPath $platformRoot -PathType Container) {
              $mpCmdRunCandidates = @(
                Get-ChildItem -LiteralPath $platformRoot -Directory |
                  Sort-Object Name -Descending |
                  ForEach-Object { Join-Path $_.FullName "MpCmdRun.exe" } |
                  Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
              )
            }
            if ($mpCmdRunCandidates.Count -gt 0) {
              $mpCmdRun = $mpCmdRunCandidates[0]
            } else {
              $mpCmdRun = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
            }
            if (-not (Test-Path -LiteralPath $mpCmdRun -PathType Leaf)) {
              throw "The current Microsoft Defender command-line tool could not be found."
            }
            function Invoke-MpCmdRun {
              param([Parameter(Mandatory = $true)][string[]]$Arguments)
              $output = @(& $mpCmdRun @Arguments 2>&1)
              $exitCode = $LASTEXITCODE
              $script:lastNativeScanExitCode = $exitCode
              foreach ($line in $output) {
                Write-Host $line
              }
              return [pscustomobject]@{
                ExitCode = $exitCode
                Output = @($output | ForEach-Object { [string]$_ })
              }
            }

            $candidateScanStartedAt = [DateTime]::UtcNow
            $baselineDetections = @(Get-MpThreatDetection -ErrorAction Stop)
            $baselineDetectionIds = @(
              $baselineDetections |
                ForEach-Object { [string]$_.DetectionID } |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )
            $scanRecords = @(
              foreach ($target in $targetPaths) {
                $preScanHash = (
                  Get-FileHash -LiteralPath $target -Algorithm SHA256
                ).Hash.ToLowerInvariant()
                $exclusionResult = Invoke-MpCmdRun `
                  -Arguments @("-CheckExclusion", "-Path", $target)
                if ([int]$exclusionResult.ExitCode -eq 0) {
                  throw "A final Windows candidate is excluded from Defender scanning."
                }
                if ([int]$exclusionResult.ExitCode -ne 1) {
                  throw "Defender returned an unexpected exclusion-check exit code for '$(Split-Path -Leaf $target)': $($exclusionResult.ExitCode)."
                }

                $scanStartedAt = [DateTime]::UtcNow
                $scanResult = Invoke-MpCmdRun `
                  -Arguments @("-Scan", "-ScanType", "3", "-File", $target)
                $scanCompletedAt = [DateTime]::UtcNow
                if ([int]$scanResult.ExitCode -ne 0) {
                  throw "Defender custom scan failed for '$(Split-Path -Leaf $target)' with exit code $($scanResult.ExitCode)."
                }
                if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
                  throw "Defender removed or quarantined a final Windows candidate."
                }
                $postScanHash = (
                  Get-FileHash -LiteralPath $target -Algorithm SHA256
                ).Hash.ToLowerInvariant()
                if ($postScanHash -cne $preScanHash) {
                  throw "A final Windows candidate changed during Defender scanning."
                }

                [pscustomobject][ordered]@{
                  Path = $target
                  Name = Split-Path -Leaf $target
                  PreScanSha256 = $preScanHash
                  PostScanSha256 = $postScanHash
                  ExclusionCheckExitCode = [int]$exclusionResult.ExitCode
                  ScanExitCode = [int]$scanResult.ExitCode
                  ScanStartedAt = $scanStartedAt.ToString("o")
                  ScanCompletedAt = $scanCompletedAt.ToString("o")
                }
              }
            )

            # Allow delayed cloud verdicts to reach the local detection history.
            Start-Sleep -Seconds 10
            $detectionsAfterScan = @(Get-MpThreatDetection -ErrorAction Stop)
            $newDetections = @(
              $detectionsAfterScan |
                Where-Object {
                  $detectionId = [string]$_.DetectionID
                  [string]::IsNullOrWhiteSpace($detectionId) -or
                    $baselineDetectionIds -notcontains $detectionId
                }
            )
            $candidateDetections = @(
              $detectionsAfterScan |
                Where-Object {
                  $resources = [string]::Join("`n", @($_.Resources))
                  $matchesTarget = $false
                  foreach ($target in $targetPaths) {
                    if ($resources.IndexOf(
                        $target,
                        [System.StringComparison]::OrdinalIgnoreCase
                      ) -ge 0 -or
                      $resources.IndexOf(
                        (Split-Path -Leaf $target),
                        [System.StringComparison]::OrdinalIgnoreCase
                      ) -ge 0) {
                      $matchesTarget = $true
                      break
                    }
                  }
                  $matchesTarget
                }
            )
            if ($newDetections.Count -ne 0 -or $candidateDetections.Count -ne 0) {
              throw "Defender reported a new or candidate-related detection."
            }

            $finalDefenderState = Get-ValidatedDefenderState
            $service = $finalDefenderState.Service
            $status = $finalDefenderState.Status
            $preference = $finalDefenderState.Preference
            $pathExclusions = @($finalDefenderState.PathExclusions)
            $extensionExclusions = @($finalDefenderState.ExtensionExclusions)
            $processExclusions = @($finalDefenderState.ProcessExclusions)
            $files = @(
              foreach ($record in $scanRecords) {
                if (-not (Test-Path -LiteralPath $record.Path -PathType Leaf)) {
                  throw "Defender removed or quarantined a final Windows candidate."
                }
                $finalHash = (
                  Get-FileHash -LiteralPath $record.Path -Algorithm SHA256
                ).Hash.ToLowerInvariant()
                if ($finalHash -cne $record.PreScanSha256) {
                  throw "A final Windows candidate changed after Defender scanning."
                }
                [ordered]@{
                  name = $record.Name
                  sha256 = $finalHash
                  preScanSha256 = $record.PreScanSha256
                  postScanSha256 = $finalHash
                  excluded = $false
                  exclusionCheckExitCode = $record.ExclusionCheckExitCode
                  scanExitCode = $record.ScanExitCode
                  scanStartedAt = $record.ScanStartedAt
                  scanCompletedAt = $record.ScanCompletedAt
                  detectionDelta = 0
                  scanResult = "clean"
                }
              }
            )
            $summary = [ordered]@{
              schemaVersion = 1
              result = "clean"
              repository = $env:GITHUB_REPOSITORY
              workflow = $env:GITHUB_WORKFLOW
              workflowRef = $env:GITHUB_WORKFLOW_REF
              runId = $env:GITHUB_RUN_ID
              runAttempt = $env:GITHUB_RUN_ATTEMPT
              sourceSha = $env:SOURCE_SHA
              releaseTag = $env:RELEASE_TAG
              releaseRef = $env:GITHUB_REF
              packageArtifactId = $env:PACKAGE_ARTIFACT_ID
              packageArtifactDigest = $env:PACKAGE_ARTIFACT_DIGEST
              packageDownloadOutcome = $env:DOWNLOAD_OUTCOME
              controlledImageId = $env:CONTROLLED_IMAGE_ID
              observedControlledImageId = $env:OBSERVED_CONTROLLED_IMAGE_ID
              defenderPolicyBlobId = $defenderPolicyBlobId
              releaseWorkflowBlobId = $releaseWorkflowBlobId
              runnerEnvironment = $env:RUNNER_ENVIRONMENT
              runnerOS = $env:RUNNER_OS
              runnerArchitecture = $env:RUNNER_ARCH
              operatingSystemVersion = $operatingSystemVersion
              defenderServiceStatus = $service.Status.ToString()
              antimalwareRunningMode = [string]$status.AMRunningMode
              antivirusEnabled = $status.AntivirusEnabled
              antimalwareServiceEnabled = $status.AMServiceEnabled
              realTimeProtectionEnabled = $status.RealTimeProtectionEnabled
              behaviorMonitorEnabled = $status.BehaviorMonitorEnabled
              ioavProtectionEnabled = $status.IoavProtectionEnabled
              onAccessProtectionEnabled = $status.OnAccessProtectionEnabled
              cloudDeliveredProtectionEnabled = ([int]$preference.MAPSReporting -eq 2)
              blockAtFirstSeenEnabled = (-not [bool]$preference.DisableBlockAtFirstSeen)
              automaticSampleSubmissionEnabled = ([int]$preference.SubmitSamplesConsent -eq 1)
              puaProtectionEnabled = ([int]$preference.PUAProtection -eq 1)
              mapsReporting = [int]$preference.MAPSReporting
              submitSamplesConsent = [int]$preference.SubmitSamplesConsent
              mapsConnectionValidated = [bool]$readiness.mapsConnectionValidated
              mapsValidationExitCode = [int]$readiness.mapsValidationExitCode
              detectionSmokeTestPassed = [bool]$readiness.detectionSmokeTestPassed
              securityIntelligenceUpdateSource = [string]$readiness.securityIntelligenceUpdateSource
              filesystemPathExclusionCount = $pathExclusions.Count
              fileExtensionExclusionCount = $extensionExclusions.Count
              processExclusionCount = $processExclusions.Count
              antimalwareEngineVersion = $status.AMEngineVersion
              antimalwareProductVersion = $status.AMProductVersion
              antivirusSignatureVersion = $status.AntivirusSignatureVersion
              antivirusSignatureAge = [int]$status.AntivirusSignatureAge
              antivirusSignatureLastUpdated = $status.AntivirusSignatureLastUpdated.ToUniversalTime().ToString("o")
              newDetectionCount = $newDetections.Count
              scanAttemptStartedAt = $scanAttemptStartedAt.ToString("o")
              candidateScanStartedAt = $candidateScanStartedAt.ToString("o")
              scanCompletedAt = [DateTime]::UtcNow.ToString("o")
              files = $files
            }
            $summary |
              ConvertTo-Json -Depth 5 |
              Set-Content -LiteralPath $evidencePath -Encoding utf8NoBOM
          } catch {
            $scanFailure = $_
            $blockedStatus = $null
            try {
              $blockedStatus = Get-MpComputerStatus -ErrorAction Stop
            } catch {
              Write-Host "Defender status was unavailable for blocked evidence."
            }
            $threatNames = @{}
            $threatNameQueryError = $null
            try {
              foreach ($threat in @(Get-MpThreat -ErrorAction Stop)) {
                $threatNames[[string]$threat.ThreatID] = [string]$threat.ThreatName
              }
            } catch {
              $threatNameQueryError = $_.Exception.Message
              Write-Host "Defender threat names were unavailable for blocked evidence."
            }
            function Convert-ToEvidenceTimestamp {
              param([object]$Value)
              if ($null -eq $Value) {
                return $null
              }
              try {
                return ([DateTime]$Value).ToUniversalTime().ToString("o")
              } catch {
                return $null
              }
            }
            $blockedDetections = @()
            $blockedDetectionQueryError = $null
            try {
              $blockedDetections = @(
                foreach ($detection in @(Get-MpThreatDetection -ErrorAction Stop)) {
                  $resources = @($detection.Resources | ForEach-Object { [string]$_ })
                  $resourceText = [string]::Join("`n", $resources)
                  $matchesCandidate = $false
                  foreach ($target in $targetPaths) {
                    if ($resourceText.IndexOf(
                        $target,
                        [System.StringComparison]::OrdinalIgnoreCase
                      ) -ge 0 -or
                      $resourceText.IndexOf(
                        (Split-Path -Leaf $target),
                        [System.StringComparison]::OrdinalIgnoreCase
                      ) -ge 0) {
                      $matchesCandidate = $true
                      break
                    }
                  }
                  $initialDetectionTime = Convert-ToEvidenceTimestamp `
                    -Value $detection.InitialDetectionTime
                  $lastStatusChangeTime = Convert-ToEvidenceTimestamp `
                    -Value $detection.LastThreatStatusChangeTime
                  $isSmokeDetection = (
                    $resourceText.IndexOf(
                      "tailchrome-defender-smoke-",
                      [System.StringComparison]::OrdinalIgnoreCase
                    ) -ge 0
                  )
                  $detectedDuringCandidateScan = (
                    $null -ne $candidateScanStartedAt -and
                    $null -ne $initialDetectionTime -and
                    [DateTime]::Parse(
                      $initialDetectionTime,
                      [System.Globalization.CultureInfo]::InvariantCulture,
                      [System.Globalization.DateTimeStyles]::AdjustToUniversal
                    ) -ge $candidateScanStartedAt
                  )
                  if ($matchesCandidate -or
                      ($detectedDuringCandidateScan -and -not $isSmokeDetection)) {
                    $threatId = [string]$detection.ThreatID
                    [ordered]@{
                      threatId = $threatId
                      threatName = [string]$threatNames[$threatId]
                      detectionId = [string]$detection.DetectionID
                      initialDetectionTime = $initialDetectionTime
                      lastThreatStatusChangeTime = $lastStatusChangeTime
                      actionSuccess = [bool]$detection.ActionSuccess
                      currentThreatExecutionStatusId = (
                        [int]$detection.CurrentThreatExecutionStatusID
                      )
                      threatStatusId = [int]$detection.ThreatStatusID
                      resources = $resources
                    }
                  }
                }
              )
            } catch {
              $blockedDetectionQueryError = $_.Exception.Message
              Write-Host "Defender detections were unavailable for blocked evidence."
            }
            $blockedFiles = @(
              foreach ($file in $expectedFiles) {
                $exists = $false
                $currentHash = $null
                $readError = $null
                try {
                  $exists = Test-Path `
                    -LiteralPath $file.path `
                    -PathType Leaf `
                    -ErrorAction Stop
                  if ($exists) {
                    $currentHash = (
                      Get-FileHash `
                        -LiteralPath $file.path `
                        -Algorithm SHA256 `
                        -ErrorAction Stop
                    ).Hash.ToLowerInvariant()
                  }
                } catch {
                  $readError = $_.Exception.Message
                }
                [ordered]@{
                  name = $file.name
                  sha256 = $file.sha256
                  currentSha256 = $currentHash
                  exists = $exists
                  readError = $readError
                }
              }
            )
            $signatureLastUpdated = $null
            if ($null -ne $blockedStatus -and
                $null -ne $blockedStatus.AntivirusSignatureLastUpdated) {
              $signatureLastUpdated = Convert-ToEvidenceTimestamp `
                -Value $blockedStatus.AntivirusSignatureLastUpdated
            }
            $candidateScanStartedAtString = $null
            if ($null -ne $candidateScanStartedAt) {
              $candidateScanStartedAtString = $candidateScanStartedAt.ToString("o")
            }
            $blockedSummary = [ordered]@{
              schemaVersion = 1
              result = "blocked"
              repository = $env:GITHUB_REPOSITORY
              workflow = $env:GITHUB_WORKFLOW
              workflowRef = $env:GITHUB_WORKFLOW_REF
              runId = $env:GITHUB_RUN_ID
              runAttempt = $env:GITHUB_RUN_ATTEMPT
              sourceSha = $env:SOURCE_SHA
              releaseTag = $env:RELEASE_TAG
              releaseRef = $env:GITHUB_REF
              packageArtifactId = $env:PACKAGE_ARTIFACT_ID
              packageArtifactDigest = $env:PACKAGE_ARTIFACT_DIGEST
              packageDownloadOutcome = $env:DOWNLOAD_OUTCOME
              controlledImageId = $env:CONTROLLED_IMAGE_ID
              observedControlledImageId = $env:OBSERVED_CONTROLLED_IMAGE_ID
              defenderPolicyBlobId = $defenderPolicyBlobId
              releaseWorkflowBlobId = $releaseWorkflowBlobId
              runnerEnvironment = $env:RUNNER_ENVIRONMENT
              runnerOS = $env:RUNNER_OS
              runnerArchitecture = $env:RUNNER_ARCH
              operatingSystemVersion = $operatingSystemVersion
              antimalwareRunningMode = [string]$blockedStatus.AMRunningMode
              antimalwareEngineVersion = [string]$blockedStatus.AMEngineVersion
              antimalwareProductVersion = [string]$blockedStatus.AMProductVersion
              antivirusSignatureVersion = [string]$blockedStatus.AntivirusSignatureVersion
              antivirusSignatureLastUpdated = $signatureLastUpdated
              scanAttemptStartedAt = $scanAttemptStartedAt.ToString("o")
              candidateScanStartedAt = $candidateScanStartedAtString
              scanCompletedAt = [DateTime]::UtcNow.ToString("o")
              lastNativeScanExitCode = $script:lastNativeScanExitCode
              failure = [ordered]@{
                message = $scanFailure.Exception.Message
                fullyQualifiedErrorId = $scanFailure.FullyQualifiedErrorId
                category = [string]$scanFailure.CategoryInfo.Category
              }
              threatNameQueryError = $threatNameQueryError
              detectionQueryError = $blockedDetectionQueryError
              detectionCount = $blockedDetections.Count
              detections = $blockedDetections
              files = $blockedFiles
            }
            try {
              $blockedSummary |
                ConvertTo-Json -Depth 6 |
                Set-Content -LiteralPath $evidencePath -Encoding utf8NoBOM
            } catch {
              Write-Host "Blocked Defender evidence could not be written: $($_.Exception.Message)"
            }
            throw $scanFailure
          }
      - name: Upload automated Defender evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-defender-evidence
          retention-days: 7
          if-no-files-found: error
          path: signed-windows/windows-defender-verification.json

  assemble-release-candidate:
    needs:
      [build, sign-macos, package-macos, package-linux, package-windows, scan-windows-defender]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      EXPECTED_MSI_SHA256: ${{ needs.package-windows.outputs.msi_sha256 }}
      EXPECTED_RAW_SHA256: ${{ needs.package-windows.outputs.raw_sha256 }}
      PACKAGE_ARTIFACT_DIGEST: ${{ needs.package-windows.outputs.artifact_digest }}
      PACKAGE_ARTIFACT_ID: ${{ needs.package-windows.outputs.artifact_id }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
    outputs:
      sha256sums_digest: ${{ steps.manifest.outputs.sha256sums_digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.source_sha }}
      - name: Download reviewed build outputs
        uses: actions/download-artifact@v6
        with:
          name: build-output
          path: build-output
      - name: Download final Darwin binaries
        uses: actions/download-artifact@v6
        with:
          name: signed-darwin
          path: signed-darwin
      - name: Download final macOS package
        uses: actions/download-artifact@v6
        with:
          name: signed-macos-package
          path: signed-macos-package
      - name: Download final Linux packages
        uses: actions/download-artifact@v6
        with:
          name: linux-packages
          path: linux-packages
      - name: Download final Windows bundle
        uses: actions/download-artifact@v6
        with:
          name: signed-windows
          path: signed-windows
      - name: Download automated Defender evidence
        uses: actions/download-artifact@v6
        with:
          name: windows-defender-evidence
          path: windows-defender-evidence
      - name: Collect and allowlist final assets
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
          mkdir -p candidate/release candidate/evidence
          cp build-output/packages/extension/.output/chrome.zip candidate/release/
          cp build-output/packages/extension/.output/firefox.zip candidate/release/
          cp build-output/packages/extension/.output/firefox-sources.zip candidate/release/
          cp signed-darwin/tailscale-browser-ext-darwin-amd64 candidate/release/
          cp signed-darwin/tailscale-browser-ext-darwin-arm64 candidate/release/
          cp signed-macos-package/tailchrome-helper-macos.pkg candidate/release/
          cp build-output/dist/tailscale-browser-ext-linux-amd64 candidate/release/
          cp build-output/dist/tailscale-browser-ext-linux-arm64 candidate/release/
          cp linux-packages/tailchrome-helper-linux-amd64.deb candidate/release/
          cp linux-packages/tailchrome-helper-linux-x86_64.rpm candidate/release/
          cp signed-windows/tailscale-browser-ext-windows-amd64.exe candidate/release/
          cp signed-windows/tailchrome-helper-windows-x64.msi candidate/release/
          install -m 0755 scripts/install.sh candidate/release/tailchrome-install.sh
          cp signed-windows/windows-signature-verification.json candidate/evidence/
          cp windows-defender-evidence/windows-defender-verification.json candidate/evidence/

          defender_summary="candidate/evidence/windows-defender-verification.json"
          test "$(jq -r .result "$defender_summary")" = "clean"
          test "$(jq -r .repository "$defender_summary")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .runId "$defender_summary")" = "$GITHUB_RUN_ID"
          test "$(jq -r .runAttempt "$defender_summary")" = "$GITHUB_RUN_ATTEMPT"
          test "$(jq -r .sourceSha "$defender_summary")" = "$SOURCE_SHA"
          test "$(jq -r .releaseTag "$defender_summary")" = "$RELEASE_TAG"
          test "$(jq -r .releaseRef "$defender_summary")" = "refs/tags/$RELEASE_TAG"
          test "$(jq -r .packageArtifactId "$defender_summary")" = "$PACKAGE_ARTIFACT_ID"
          test "$(jq -r .packageArtifactDigest "$defender_summary")" = "$PACKAGE_ARTIFACT_DIGEST"
          test "$(jq -r .packageDownloadOutcome "$defender_summary")" = "success"
          jq -e '
            (.controlledImageId | strings | length > 0) and
            .observedControlledImageId == .controlledImageId
          ' "$defender_summary" >/dev/null
          test "$(
            sha256sum signed-windows/tailscale-browser-ext-windows-amd64.exe |
              cut -d' ' -f1
          )" = "$EXPECTED_RAW_SHA256"
          test "$(
            sha256sum signed-windows/tailchrome-helper-windows-x64.msi |
              cut -d' ' -f1
          )" = "$EXPECTED_MSI_SHA256"

          cat > candidate/expected-assets.txt <<'ASSETS'
          chrome.zip
          firefox-sources.zip
          firefox.zip
          tailchrome-helper-linux-amd64.deb
          tailchrome-helper-linux-x86_64.rpm
          tailchrome-helper-macos.pkg
          tailchrome-helper-windows-x64.msi
          tailchrome-install.sh
          tailscale-browser-ext-darwin-amd64
          tailscale-browser-ext-darwin-arm64
          tailscale-browser-ext-linux-amd64
          tailscale-browser-ext-linux-arm64
          tailscale-browser-ext-windows-amd64.exe
          ASSETS
          sed -i 's/^          //' candidate/expected-assets.txt
          find candidate/release -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
            sort > candidate/actual-assets.txt
          diff -u candidate/expected-assets.txt candidate/actual-assets.txt
          find candidate/evidence -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
            sort > candidate/actual-evidence.txt
          printf '%s\n' \
            windows-defender-verification.json \
            windows-signature-verification.json \
            > candidate/expected-evidence.txt
          diff -u candidate/expected-evidence.txt candidate/actual-evidence.txt
      - name: Generate final checksum manifest
        id: manifest
        run: |
          set -euo pipefail
          (
            cd candidate/release
            while IFS= read -r asset; do
              sha256sum "$asset"
            done < ../expected-assets.txt > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          digest="$(sha256sum candidate/release/SHA256SUMS.txt | cut -d' ' -f1)"
          defender_image_id="$(
            jq -r .controlledImageId \
              candidate/evidence/windows-defender-verification.json
          )"
          defender_evidence_sha256="$(
            sha256sum candidate/evidence/windows-defender-verification.json |
              cut -d' ' -f1
          )"
          echo "sha256sums_digest=$digest" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow ".github/workflows/release.yml" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg sha256sums_sha256 "$digest" \
            --arg windows_package_artifact_id "$PACKAGE_ARTIFACT_ID" \
            --arg windows_package_artifact_digest "$PACKAGE_ARTIFACT_DIGEST" \
            --arg windows_raw_sha256 "$EXPECTED_RAW_SHA256" \
            --arg windows_msi_sha256 "$EXPECTED_MSI_SHA256" \
            --arg windows_defender_image_id "$defender_image_id" \
            --arg windows_defender_evidence_sha256 "$defender_evidence_sha256" \
            '{
              schemaVersion: 1,
              repository: $repository,
              workflow: $workflow,
              runId: $run_id,
              runAttempt: $run_attempt,
              releaseTag: $release_tag,
              sourceSha: $source_sha,
              sha256sumsSha256: $sha256sums_sha256,
              windowsPackageArtifactId: $windows_package_artifact_id,
              windowsPackageArtifactDigest: $windows_package_artifact_digest,
              windowsRawSha256: $windows_raw_sha256,
              windowsMsiSha256: $windows_msi_sha256,
              windowsDefenderImageId: $windows_defender_image_id,
              windowsDefenderEvidenceSha256: $windows_defender_evidence_sha256
            }' > candidate/candidate-metadata.json
      - name: Generate final artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: candidate/release/*
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@v6
        with:
          name: helper-release-candidate
          path: candidate/
          retention-days: 90
          compression-level: 0
      - name: Write candidate summary
        run: |
          {
            echo "## Immutable release candidate"
            echo
            echo "- Candidate run ID: \`$GITHUB_RUN_ID\`"
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- SHA256SUMS.txt digest: \`${{ steps.manifest.outputs.sha256sums_digest }}\`"
            echo
            echo '```text'
            cat candidate/release/SHA256SUMS.txt
            echo '```'
            echo
            echo "Publication remains blocked until the exact Windows hashes pass Defender and Malwarebytes review and the protected publication workflow is approved."
          } >> "$GITHUB_STEP_SUMMARY"
