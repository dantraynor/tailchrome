name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Most jobs do not launch a browser. The e2e launcher installs its browser
  # explicitly, so dependency installation never needs Puppeteer's postinstall
  # download.
  PUPPETEER_SKIP_DOWNLOAD: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      host: ${{ steps.filter.outputs.host }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            host:
              - 'host/**'
              - 'Makefile'
            packaging:
              - 'host/**'
              - 'packaging/**'
              - 'scripts/install.sh'
              - 'scripts/install.test.sh'
              - 'scripts/initialize-windows-defender.ps1'
              - 'scripts/verify-windows-signatures.ps1'
              - 'scripts/verify-windows-signatures.test.ps1'
              - 'Makefile'
              - '.github/workflows/*.yml'

  extension-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm validate:ids
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:installer
      - name: Lint installer shell script
        run: shellcheck scripts/install.sh scripts/install.test.sh

  e2e-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:chrome

  build-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:chrome
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: chrome-build
          overwrite: true
          path: packages/extension/.output/chrome-mv3/

  review-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm review:firefox
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: firefox-build
          overwrite: true
          path: packages/extension/.output/firefox-mv3/

  host-build:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - run: go mod download
        working-directory: host
      - run: go vet ./...
        working-directory: host
      - run: go test -race ./...
        working-directory: host
      - run: make host
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: host-binary
          overwrite: true
          path: dist/tailscale-browser-ext

  host-windows-tests:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - run: go test ./...
        working-directory: host

  package-linux:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: Install nFPM
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Build and inspect raw Linux helpers
        run: |
          set -euo pipefail
          make host-linux-amd64 host-linux-arm64
          file dist/tailscale-browser-ext-linux-amd64 |
            tee /dev/stderr |
            grep -Eq 'x86-64|x86_64'
          file dist/tailscale-browser-ext-linux-arm64 |
            tee /dev/stderr |
            grep -Eq 'ARM aarch64|ARM64'
          go version -m dist/tailscale-browser-ext-linux-amd64
          go version -m dist/tailscale-browser-ext-linux-arm64
      - run: VERSION=0.0.0 ./packaging/linux/build-packages.sh
      - name: Inspect Linux package ownership and metadata
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes rpm
          dpkg-deb --info dist/tailchrome-helper-linux-amd64.deb
          deb_control="$RUNNER_TEMP/tailchrome-deb-control"
          dpkg-deb --control dist/tailchrome-helper-linux-amd64.deb "$deb_control"
          for script in preinst postinst prerm postrm config triggers; do
            test ! -e "$deb_control/$script"
          done
          dpkg-deb --contents dist/tailchrome-helper-linux-amd64.deb |
            tee /tmp/tailchrome-deb-contents.txt
          rpm -qip dist/tailchrome-helper-linux-x86_64.rpm
          test -z "$(rpm -qp --scripts dist/tailchrome-helper-linux-x86_64.rpm)"
          rpm -qlp dist/tailchrome-helper-linux-x86_64.rpm |
            tee /tmp/tailchrome-rpm-contents.txt
          if grep -E '(^|/)(home|Users)/' \
            /tmp/tailchrome-deb-contents.txt \
            /tmp/tailchrome-rpm-contents.txt; then
            echo "Linux packages contain an unexpected user-home path." >&2
            exit 1
          fi

  macos-package-smoke:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: Validate repair app sources
        run: |
          set -euo pipefail
          plutil -lint packaging/macos/TailchromeHelper.app/Contents/Info.plist
          bash -n \
            packaging/macos/TailchromeHelper.app/Contents/MacOS/tailchrome-helper \
            packaging/macos/build-pkg.sh \
            packaging/macos/scripts/postinstall
          test -x packaging/macos/TailchromeHelper.app/Contents/MacOS/tailchrome-helper
      - name: Build and inspect unsigned package
        run: |
          set -euo pipefail
          VERSION=0.0.0 ./packaging/macos/build-pkg.sh
          expanded="$RUNNER_TEMP/tailchrome-pkg"
          pkgutil --expand-full dist/tailchrome-helper-macos.pkg "$expanded"
          app="$expanded/Payload/Applications/Tailchrome Helper.app"
          test -f "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/tailchrome-helper"
          test -x "$expanded/Payload/Library/Application Support/Tailscale/BrowserExt/tailscale-browser-ext"

  windows-signature-verifier:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      WINDOWS_SIGNTOOL_PATH: C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2
      - name: Verify fixed Windows SDK
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:WINDOWS_SIGNTOOL_PATH -PathType Leaf)) {
            throw "Expected SignTool was not found at $env:WINDOWS_SIGNTOOL_PATH"
          }
      - name: Parse Defender initialization script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\scripts\initialize-windows-defender.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $messages = @($errors | ForEach-Object { $_.Message })
            throw "Defender initialization script parse failed: $($messages -join '; ')"
          }
      - name: Run Windows signature verifier tests
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\verify-windows-signatures.test.ps1

  workflow-static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: Run ShellCheck
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            koalaman/shellcheck:v0.11.0 \
            scripts/install.sh \
            scripts/install.test.sh \
            packaging/linux/build-packages.sh \
            packaging/macos/build-pkg.sh \
            packaging/macos/scripts/postinstall
