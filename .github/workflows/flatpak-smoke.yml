name: Flatpak helper smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            app_id: com.google.Chrome
          - browser: firefox
            app_id: org.mozilla.firefox
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: Prepare a clean ${{ matrix.browser }} Flatpak installation
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub "$APP_ID"
          # The smoke script intentionally refuses to touch an app instance it
          # did not start. Seed only the clean app directory it needs; the
          # helper launch below is the first process started in the sandbox.
          install -d -m 700 "$HOME/.var/app/$APP_ID"
        env:
          APP_ID: ${{ matrix.app_id }}
      - name: Verify helper framing inside the sandbox
        run: dbus-run-session -- bash scripts/test-flatpak.sh "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Retain smoke diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: flatpak-helper-smoke-log-${{ matrix.browser }}
          path: .context/flatpak-smoke-${{ matrix.browser }}.log
          include-hidden-files: true
          if-no-files-found: warn
